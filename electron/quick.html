<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workie — Aggiungi task</title>
<style>
  /* Fallback dark (i colori veri arrivano dall'app via onTheme) */
  :root{
    --bg:#171718; --panel:#232325; --panel2:#2a2a2d; --inset:#1b1b1d;
    --text:#ededec; --text-dim:#b6b6b8; --muted:#7d7d82;
    --border:rgba(255,255,255,.07); --border-soft:rgba(255,255,255,.045); --border-strong:rgba(255,255,255,.18);
    --accent:#b8a6f4; --accent2:#cdbef9; --accent-soft:rgba(184,166,244,.14);
    --btn-text:#1c1830;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none;}
  html,body{background:transparent; overflow:hidden;
    font-family:-apple-system,"SF Pro Text","Inter",system-ui,sans-serif; color:var(--text);}
  .wrap{padding:9px 11px 12px;}
  .beak{position:absolute; top:3px; left:50%; width:14px; height:14px; background:var(--panel);
    border-left:1px solid var(--border); border-top:1px solid var(--border);
    transform:translateX(-50%) rotate(45deg); border-radius:4px 0 0 0; z-index:2;}

  /* ---- STEP 1: barra stile Claude ---- */
  .bar{display:flex; align-items:flex-end; gap:6px; background:var(--panel); border:1px solid var(--border);
    border-radius:18px; padding:7px 7px 7px 12px; box-shadow:0 12px 34px rgba(10,8,22,.30);}
  body.recording .bar{padding-left:7px;}
  .field{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center;}
  textarea#ta{width:100%; max-height:138px; resize:none; background:transparent; border:0; outline:none;
    color:var(--text); font-family:inherit; font-size:14px; line-height:1.42; padding:8px 2px; overflow-y:auto;
    -webkit-user-select:text; user-select:text;}
  textarea#ta::placeholder{color:var(--muted);}
  /* onda: strip sottile sotto il testo, compare/sparisce animata */
  .wave{display:flex; align-items:flex-end; gap:2px; height:0; margin:0 2px; overflow:hidden; opacity:0;
    transition:height .3s cubic-bezier(.22,1,.36,1), margin .3s cubic-bezier(.22,1,.36,1), opacity .22s ease;}
  body.recording .wave{height:13px; margin:2px 2px 6px; opacity:1;}
  .wave .bar2{flex:1; min-width:2px; max-width:4px; height:14%; align-self:flex-end; background:var(--accent); border-radius:3px; transition:height .09s ease-out;}
  .icbtn{flex:none; width:34px; height:34px; border:0; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s ease, color .15s ease, border-radius .25s ease;}
  .icbtn svg{width:17px; height:17px;}
  .cancel{background:var(--border-strong); color:var(--text);}  /* X dentro un pallino grigio: annulla, non salva */
  .cancel:hover{color:#e0574c;}
  .mic{background:transparent; color:var(--muted);}
  .mic:hover{background:var(--inset); color:var(--text);}
  .mic .i-stop{display:none;}
  .mic.rec{background:#e0574c; color:#fff; animation:pulse 1.6s ease-in-out infinite;} /* cerchio rosso col quadrato = stop & salva */
  .mic.rec .i-mic{display:none;} .mic.rec .i-stop{display:flex;}
  .mic.rec svg{width:12px; height:12px;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,87,76,.5);}50%{box-shadow:0 0 0 6px rgba(224,87,76,0);}}
  .send{background:var(--accent); color:var(--btn-text);}
  .send:hover{filter:brightness(1.06);}
  .send:disabled{opacity:.45; cursor:default;}

  .hint{margin-top:8px; font-size:11px; color:var(--muted); text-align:center; min-height:13px;}
  .hint.ok{color:#2ea36a;} .hint.err{color:#e0574c;}

  /* scrollbar sottile */
  textarea#ta::-webkit-scrollbar,.list::-webkit-scrollbar{width:7px;}
  textarea#ta::-webkit-scrollbar-track,.list::-webkit-scrollbar-track{background:transparent; margin:4px 0;}
  textarea#ta::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px; border:2px solid transparent; background-clip:content-box;}

  /* ---- STEP 2: anteprima ---- */
  .panel{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:13px;
    box-shadow:0 12px 34px rgba(10,8,22,.30);}
  .revh{font-size:12.5px; color:var(--text-dim); margin-bottom:10px; line-height:1.4;}
  .revh b{color:var(--text);}
  .list{max-height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -2px; padding:0 2px;}
  /* righe senza bordi: solo un filo di sfondo per separarle */
  .mt-row{background:var(--inset); border:0; border-radius:12px; padding:9px 11px;}
  .mt-row .rt{width:100%; background:transparent; border:0; color:var(--text); font-size:13.5px; font-weight:550; outline:none; -webkit-user-select:text; user-select:text;}
  .mt-row .rt::placeholder{color:var(--muted);}
  /* data semplificata: chip Oggi / Domani / Manuale */
  .rdates{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .rchip{border:1px solid var(--border); background:transparent; color:var(--text-dim); font-size:11.5px; font-weight:550;
    padding:4px 11px; border-radius:999px; cursor:pointer; font-family:inherit; transition:background .14s,color .14s,border-color .14s;}
  .rchip:hover{color:var(--text); border-color:var(--border-strong);}
  .rchip.on{background:var(--accent-soft); border-color:transparent; color:var(--accent);}
  .rm{margin-left:auto; width:24px; height:24px; border:0; background:transparent; color:var(--muted); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;}
  .rm svg{width:13px; height:13px;} .rm:hover{background:var(--border-soft); color:#e0574c;}
  .rman{display:none; gap:6px; margin-top:8px;}
  .rman.show{display:flex;}
  .rman input[type=date],.rman input[type=time]{background:var(--panel2); border:1px solid var(--border-soft);
    border-radius:8px; color:var(--text-dim); font-size:11.5px; padding:4px 7px; outline:none; font-family:inherit; color-scheme:dark;}
  body.light .rman input[type=date],body.light .rman input[type=time]{color-scheme:light;}
  .rman input[type=date]{flex:1;}
  /* bottone "aggiungi task" in stile app (ghost tratteggiato) */
  .mt-add{display:flex; align-items:center; justify-content:center; gap:7px; width:100%; margin-top:8px;
    background:transparent; border:1px dashed var(--border-strong); color:var(--text-dim); border-radius:12px;
    padding:9px; font-size:12.5px; font-weight:550; font-family:inherit; cursor:pointer; transition:color .14s,border-color .14s;}
  .mt-add:hover{color:var(--accent); border-color:var(--accent);}
  .mt-add svg{width:15px; height:15px;}
  .ractions{display:flex; gap:8px; margin-top:12px;}
  .btn{flex:1; border:0; border-radius:11px; cursor:pointer; font-size:13.5px; font-weight:600; padding:10px; background:var(--accent); color:var(--btn-text);}
  .btn:active{transform:translateY(1px);} .btn:disabled{opacity:.55; cursor:default;}
  .btn.ghost{flex:none; background:transparent; border:1px solid var(--border); color:var(--text-dim); font-weight:500; padding:10px 14px;}
  .btn.ghost:hover{color:var(--text);}
  .hide{display:none !important;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="beak"></div>

    <!-- STEP 1: barra -->
    <div class="bar" id="bar">
      <button class="icbtn cancel hide" id="cancel" title="Annulla dettatura">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
      <div class="field">
        <textarea id="ta" rows="1" placeholder="Aggiungi una o più task…" spellcheck="false"></textarea>
        <div class="wave" id="wave"></div>
      </div>
      <button class="icbtn mic" id="mic" title="Detta le task">
        <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/><line x1="8.5" y1="21" x2="15.5" y2="21"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3.5"/></svg>
      </button>
      <button class="icbtn send" id="send" title="Crea le task">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
      </button>
    </div>
    <div class="hint" id="hint"></div>

    <!-- STEP 2: anteprima -->
    <div class="panel hide" id="stepReview">
      <div class="revh" id="revh"></div>
      <div class="list" id="list"></div>
      <button class="mt-add" id="addRow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span id="addRowLbl">Aggiungi task</span></button>
      <div class="hint" id="hint2" style="margin-top:9px"></div>
      <div class="ractions">
        <button class="btn ghost" id="back">Torna</button>
        <button class="btn" id="confirm">Aggiungi</button>
      </div>
    </div>
  </div>
<script>
  var lang='en'; try{ lang=((localStorage.getItem('workie_lang')||'en')+'').slice(0,2).toLowerCase(); }catch(e){}
  var STR={
    it:{ph:'Aggiungi una o più task…',hint:'Scrivi o detta, poi invia',listening:'Sto ascoltando… clic per fermare',transcribing:'Trascrivo…',thinking:'Preparo le task…',
      review_h:'Workie ha preparato %n task — controlla e conferma',manual_h:'Non ho capito bene le task — scrivile qui a mano',confirm:'Aggiungi %n task',addtask:'Aggiungi task',today:'Oggi',tomorrow:'Domani',manual:'Manuale',newtask:'Nuova task',back:'Torna',none:'Non ho riconosciuto nessuna task. Riprova.',added:'%n task aggiunte ✓',
      mic:'Detta le task',stop:'Ferma e salva',remove:'Rimuovi',denied:'Microfono non consentito',novoice:'Dettatura non supportata',micerr:'Errore microfono',fail:'Trascrizione non riuscita',empty:'Non ho capito, riprova'},
    en:{ph:'Add one or more tasks…',hint:'Type or dictate, then send',listening:'Listening… click to stop',transcribing:'Transcribing…',thinking:'Preparing tasks…',
      review_h:'Workie prepared %n tasks — review and confirm',manual_h:'I didn’t catch any task — type it here by hand',confirm:'Add %n tasks',addtask:'Add task',today:'Today',tomorrow:'Tomorrow',manual:'Manual',newtask:'New task',back:'Back',none:'I didn’t catch any task. Try again.',added:'%n tasks added ✓',
      mic:'Dictate tasks',stop:'Stop & save',remove:'Remove',denied:'Microphone not allowed',novoice:'Dictation not supported',micerr:'Microphone error',fail:'Transcription failed',empty:'Didn’t catch that, try again'}
  };
  var L=STR[lang]||STR.en;
  var ta=document.getElementById('ta'), mic=document.getElementById('mic'), sendBtn=document.getElementById('send'),
      hint=document.getElementById('hint'), bar=document.getElementById('bar'), wave=document.getElementById('wave'),
      stepReview=document.getElementById('stepReview'), list=document.getElementById('list'),
      revh=document.getElementById('revh'), hint2=document.getElementById('hint2'),
      cancelBtn=document.getElementById('cancel'),
      backBtn=document.getElementById('back'), confirmBtn=document.getElementById('confirm');
  var addRowBtn=document.getElementById('addRow'), addRowLbl=document.getElementById('addRowLbl');
  var DRAFTS=[], reviewManual=false;
  ta.placeholder=L.ph; mic.title=L.mic; backBtn.textContent=L.back; hint.textContent=''; if(addRowLbl)addRowLbl.textContent=L.addtask;

  function fit(){ try{ window.quickApi.resize(Math.ceil(document.querySelector('.wrap').getBoundingClientRect().height)); }catch(e){} }
  // La finestra nativa non si anima da sola: durante l'apertura/chiusura dell'onda
  // richiamo fit() a ogni frame per ~340ms, così il box cresce/scende fluido.
  function nowMs(){ return (window.performance&&performance.now)?performance.now():Date.now(); }
  function smoothFit(ms){ var t0=nowMs(); (function loop(){ fit(); if(nowMs()-t0<(ms||320)) requestAnimationFrame(loop); })(); }
  function esc(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function pad(n){ return (n<10?'0':'')+n; }
  function autoGrow(){ ta.style.height='auto'; var h=Math.min(ta.scrollHeight||36,138); if(!h||h<30)h=36; ta.style.height=h+'px'; fit(); }
  function setHint(el,msg,cls){ el.textContent=msg||''; el.className='hint'+(cls?' '+cls:''); }
  function flash(msg,cls){ var el=stepReview.classList.contains('hide')?hint:hint2; setHint(el,msg,cls);
    clearTimeout(flash._t); flash._t=setTimeout(function(){ setHint(hint,'',''); if(hint2)hint2.textContent=''; },1700); }

  // ---- tema dall'app ----
  function isDark(c){ try{ c=(c||'').trim(); if(c[0]==='#'){ var h=c.slice(1); if(h.length===3)h=h.split('').map(function(x){return x+x;}).join(''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return (0.2126*r+0.7152*g+0.0722*b)<140; } var m=c.match(/\d+/g); if(m&&m.length>=3) return (0.2126*+m[0]+0.7152*+m[1]+0.0722*+m[2])<140; }catch(e){} return true; }
  window.quickApi.onTheme(function(th){
    if(!th)return; var r=document.documentElement.style;
    function set(k,v){ if(v) r.setProperty(k,v); }
    set('--bg',th.bg); set('--panel',th.panel); set('--panel2',th.panel2); set('--inset',th.inset);
    set('--text',th.text); set('--text-dim',th.textDim); set('--muted',th.muted);
    set('--border',th.border); set('--border-soft',th.borderSoft);
    set('--accent',th.accent); set('--accent2',th.accent2); set('--accent-soft',th.accentSoft);
    var dark=isDark(th.bg); document.body.classList.toggle('light',!dark);
    r.setProperty('--border-strong', dark?'rgba(255,255,255,.18)':'rgba(20,20,35,.2)');
    r.setProperty('--btn-text', isDark(th.accent)?'#fff':'#1c1830');
    fit();
  });

  // ---- step ----
  function showInput(){ stepReview.classList.add('hide'); bar.classList.remove('hide'); hint.classList.remove('hide'); setHint(hint,'',''); requestAnimationFrame(function(){ autoGrow(); ta.focus(); fit(); }); }
  function showReview(manual){ renderReview(!!manual); bar.classList.add('hide'); hint.classList.add('hide'); stepReview.classList.remove('hide');
    requestAnimationFrame(function(){ if(manual){ var ri=list.querySelector('.rt'); if(ri)ri.focus(); } fit(); }); }

  // ---- date: oggi / domani / manuale ----
  function todayArr(){ var d=new Date(); return [d.getFullYear(),d.getMonth(),d.getDate()]; }
  function tomorrowArr(){ var d=new Date(); d.setDate(d.getDate()+1); return [d.getFullYear(),d.getMonth(),d.getDate()]; }
  function arrEq(a,b){ return !!a&&!!b&&a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]; }
  function toIso(a){ return a?(a[0]+'-'+pad(a[1]+1)+'-'+pad(a[2])):''; }
  function isoToArr(s){ if(!s||typeof s!=='string')return null; var p=s.split('-').map(Number); return (p.length===3&&p[0])?[p[0],p[1]-1,p[2]]:null; }
  function dateMode(a){ if(!a)return ''; if(arrEq(a,todayArr()))return 'today'; if(arrEq(a,tomorrowArr()))return 'tomorrow'; return 'manual'; }

  function rowHTML(d){
    var mode=dateMode(d.date), iso=toIso(d.date);
    function chip(k,lbl){ return '<button class="rchip'+(mode===k?' on':'')+'" data-d="'+k+'">'+esc(lbl)+'</button>'; }
    return '<div class="mt-row"><input class="rt" value="'+esc(d.title)+'" placeholder="'+esc(L.newtask)+'">'
      +'<div class="rdates">'+chip('today',L.today)+chip('tomorrow',L.tomorrow)+chip('manual',L.manual)
      +'<button class="rm" title="'+esc(L.remove)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button></div>'
      +'<div class="rman'+(mode==='manual'?' show':'')+'"><input type="date" class="rd" value="'+iso+'"><input type="time" class="rtime" value="'+esc(d.time||'')+'"></div></div>';
  }
  function renderReview(manual){ list.innerHTML=DRAFTS.map(rowHTML).join(''); reviewManual=!!manual; updateCounts(); }
  function updateCounts(){
    var rows=list.querySelectorAll('.mt-row'), n=0;
    rows.forEach(function(r){ if((r.querySelector('.rt').value||'').trim())n++; });
    revh.innerHTML=(reviewManual&&!n) ? esc(L.manual_h) : esc(L.review_h).replace('%n','<b>'+n+'</b>');
    confirmBtn.textContent=L.confirm.replace('%n',n); confirmBtn.disabled=!n;
  }
  // clic nella lista: rimuovi riga oppure seleziona chip data (Manuale apre il calendarino)
  list.addEventListener('click',function(e){
    var rm=e.target.closest('.rm'); if(rm){ var row=rm.closest('.mt-row'); if(row){ row.remove(); updateCounts(); fit(); } return; }
    var chip=e.target.closest('.rchip'); if(chip){ var r=chip.closest('.mt-row');
      r.querySelectorAll('.rchip').forEach(function(c){ c.classList.toggle('on',c===chip); });
      var man=r.querySelector('.rman'), isMan=chip.getAttribute('data-d')==='manual';
      man.classList.toggle('show',isMan);
      if(isMan){ var rd=r.querySelector('.rd'); if(!rd.value)rd.value=toIso(todayArr()); setTimeout(function(){ try{ rd.showPicker?rd.showPicker():rd.focus(); }catch(_){ try{rd.focus();}catch(e){} } },20); }
      fit(); return;
    }
    // clic sulla data → apri subito il calendario (niente digitazione a mano)
    var dd=e.target.closest('.rd'); if(dd){ try{ dd.showPicker&&dd.showPicker(); }catch(_){} }
  });
  list.addEventListener('input',function(e){ if(e.target&&e.target.classList.contains('rt'))updateCounts(); });
  function addRow(){ list.insertAdjacentHTML('beforeend',rowHTML({title:'',date:null,time:''})); updateCounts();
    var rows=list.querySelectorAll('.mt-row'), last=rows[rows.length-1]; if(last){ var ti=last.querySelector('.rt'); if(ti)ti.focus(); } fit(); }

  function setBusy(on){ sendBtn.disabled=on; if(on)setHint(hint,L.thinking,''); else setHint(hint,'',''); }
  // JSON tollerante: l'AI a volte avvolge in ```json … ```
  function parseLoose(s){ try{ s=String(s).replace(/```json/gi,'').replace(/```/g,'').trim(); var a=s.indexOf('{'),b=s.lastIndexOf('}'); if(a>=0&&b>a)s=s.slice(a,b+1); return JSON.parse(s); }catch(e){ return null; } }
  // Estrazione con l'AI: riconosce le task vere, scarta saluti/chiacchiere (ok:false)
  async function aiExtract(text){
    var d=new Date(), today=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var prompt="Sei l'estrattore di task di Workie. Dall'input dell'utente estrai SOLO task concrete e azionabili. "
      +"Rispondi SOLO con JSON valido, nient'altro: {\"ok\":true|false,\"tasks\":[{\"title\":\"...\",\"date\":\"YYYY-MM-DD\"|null,\"time\":\"HH:MM\"|\"\"}]}. "
      +"ok=false se l'input non contiene vere task (saluti, chiacchiere, domande generiche). Il title breve e imperativo. "
      +"Risolvi le date relative (oggi, domani, lunedì…) rispetto a oggi "+today+". Lingua: "+lang+".\n\nINPUT: "+text;
    var r=await fetch(window.quickApi.apiBase+'/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'assistant',lang:lang,messages:[{role:'user',text:prompt}]})});
    var data={}; try{ data=await r.json(); }catch(_){}
    if(!r.ok||!data||typeof data.reply!=='string') throw new Error('ai-http');
    var obj=parseLoose(data.reply); if(!obj||typeof obj!=='object') return {ok:false,tasks:[]};
    var tasks=(obj.tasks||[]).map(function(t){ return {title:String(t.title||'').trim(),date:isoToArr(t.date),time:String(t.time||'').trim()}; }).filter(function(t){return t.title;});
    return {ok:(obj.ok!==false)&&tasks.length>0, tasks:tasks};
  }
  async function analyze(){
    var text=ta.value.trim(); if(!text){ ta.focus(); return; }
    setBusy(true);
    var res=null;
    try{ res=await aiExtract(text); }
    catch(e){ try{ var local=await window.quickApi.parse(text); res={ok:!!(local&&local.length),tasks:local||[]}; }catch(_){ res={ok:false,tasks:[]}; } }
    setBusy(false);
    if(!res||!res.ok||!res.tasks.length){ DRAFTS=[{title:'',date:null,time:''}]; showReview(true); return; }
    DRAFTS=res.tasks; showReview(false);
  }
  function confirm(){
    var rows=[].slice.call(list.querySelectorAll('.mt-row')), out=[];
    rows.forEach(function(r){
      var title=(r.querySelector('.rt').value||'').trim(); if(!title)return;
      var on=r.querySelector('.rchip.on'), mode=on?on.getAttribute('data-d'):'', date=null, time='';
      if(mode==='today')date=todayArr();
      else if(mode==='tomorrow')date=tomorrowArr();
      else if(mode==='manual'){ date=isoToArr(r.querySelector('.rd').value); time=(r.querySelector('.rtime').value||'').trim(); }
      out.push({title:title,date:date,time:time});
    });
    if(!out.length){ flash(L.none,'err'); return; }
    window.quickApi.addMany(out);
    ta.value=''; autoGrow(); DRAFTS=[]; showInput(); flash(L.added.replace('%n',out.length),'ok');
  }

  sendBtn.addEventListener('click',analyze);
  backBtn.addEventListener('click',showInput);
  confirmBtn.addEventListener('click',confirm);
  if(addRowBtn)addRowBtn.addEventListener('click',addRow);
  ta.addEventListener('input',autoGrow);
  ta.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); analyze(); }
    else if(e.key==='Escape'){ e.preventDefault(); window.quickApi.close(); }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') window.quickApi.close(); });

  // ---- onde reali ----
  var audioCtx=null, analyser=null, srcNode=null, rafId=null, bars=[];
  function buildBars(n){ var h=''; for(var i=0;i<n;i++)h+='<span class="bar2"></span>'; wave.innerHTML=h; bars=[].slice.call(wave.children); }
  function startViz(){ if(!stream)return; if(!bars.length)buildBars(26);
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); srcNode=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=128; analyser.smoothingTimeConstant=0.72; srcNode.connect(analyser);
      var data=new Uint8Array(analyser.frequencyBinCount), n=bars.length, step=Math.max(1,Math.floor(data.length/n));
      (function loop(){ rafId=requestAnimationFrame(loop); analyser.getByteFrequencyData(data);
        for(var i=0;i<n;i++){ var v=data[i*step]/255; bars[i].style.height=Math.max(12,Math.min(100,v*150))+'%'; } })();
    }catch(e){}
  }
  function stopViz(){ if(rafId){cancelAnimationFrame(rafId);rafId=null;} try{srcNode&&srcNode.disconnect();}catch(_){} try{audioCtx&&audioCtx.close();}catch(_){} audioCtx=null;analyser=null;srcNode=null; bars.forEach(function(b){b.style.height='12%';}); }
  function setRec(on){ recording=on; mic.classList.toggle('rec',on); document.body.classList.toggle('recording',on);
    cancelBtn.classList.toggle('hide',!on); sendBtn.classList.toggle('hide',on); mic.title=on?L.stop:L.mic;
    if(on)startViz(); else stopViz(); smoothFit(360); }

  // ---- dettatura live ----
  var rec=null, stream=null, chunks=[], recording=false, transcribing=false, needFinal=false, dictBase='', liveTimer=null, canceled=false, preDict='';
  function blobToDataUrl(b){ return new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej; fr.readAsDataURL(b); }); }
  function stopStream(){ try{ stream&&stream.getTracks().forEach(function(x){x.stop();}); }catch(_){} stream=null; }
  function endDict(){ setHint(hint,'',''); ta.focus(); fit(); }
  async function transcribeNow(isFinal){
    if(transcribing){ if(isFinal) needFinal=true; return; }
    if(!chunks.length){ if(isFinal) endDict(); return; }
    transcribing=true;
    try{
      var blob=new Blob(chunks,{type:(rec&&rec.mimeType)||'audio/webm'});
      var dataUrl=await blobToDataUrl(blob);
      var r=await fetch(window.quickApi.apiBase+'/.netlify/functions/transcribe',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({audio:dataUrl}) });
      var data={}; try{ data=await r.json(); }catch(_){}
      if(r.ok&&typeof data.text==='string'){ ta.value=dictBase+String(data.text).trim(); autoGrow(); }
      else if(isFinal){ flash(L.fail,'err'); }
    }catch(e){ if(isFinal) flash(L.fail,'err'); }
    transcribing=false;
    if(isFinal){ endDict(); } else if(needFinal){ needFinal=false; transcribeNow(true); }
  }
  // Stop "normale": ferma e salva (trascrive l'audio accumulato).
  function stopDict(){ if(!recording)return; setRec(false); if(liveTimer){clearInterval(liveTimer);liveTimer=null;} setHint(hint,L.transcribing,''); try{ rec&&rec.state!=='inactive'&&rec.stop(); }catch(_){} }
  // Annulla: ferma e NON salva — ripristina il testo com'era prima della dettatura.
  function cancelDict(){ if(!recording)return; canceled=true; setRec(false); if(liveTimer){clearInterval(liveTimer);liveTimer=null;} needFinal=false; try{ rec&&rec.state!=='inactive'&&rec.stop(); }catch(_){} ta.value=preDict; autoGrow(); setHint(hint,'',''); ta.focus(); }
  cancelBtn.addEventListener('click',cancelDict);
  mic.addEventListener('click',async function(){
    if(recording){ stopDict(); return; }
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){ flash(L.novoice,'err'); return; }
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ flash(L.denied,'err'); return; }
    chunks=[]; needFinal=false; canceled=false; preDict=ta.value; dictBase=ta.value?(ta.value.replace(/\s+$/,'')+' '):'';
    var mime=''; try{ ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].some(function(x){ if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x)){ mime=x; return true; } return false; }); }catch(_){}
    try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }catch(e){ try{ rec=new MediaRecorder(stream); }catch(_){ flash(L.micerr,'err'); stopStream(); return; } }
    rec.ondataavailable=function(e){ if(e.data&&e.data.size)chunks.push(e.data); };
    rec.onstop=function(){ stopStream(); if(canceled){ canceled=false; endDict(); return; } transcribeNow(true); };
    setRec(true); setHint(hint,L.listening,''); rec.start(800);
    // Trascrizione live: una prima passata dopo ~1.1s, poi ogni 1.8s mentre parla.
    setTimeout(function(){ if(recording&&!transcribing) transcribeNow(false); }, 1100);
    liveTimer=setInterval(function(){ if(recording&&!transcribing) transcribeNow(false); }, 1800);
  });

  window.quickApi.onFocus(function(){
    if(recording){ setRec(false); if(liveTimer){clearInterval(liveTimer);liveTimer=null;} try{ rec&&rec.state!=='inactive'&&rec.stop(); }catch(_){} stopStream(); }
    ta.value=''; DRAFTS=[]; needFinal=false; transcribing=false; showInput();
  });
  window.addEventListener('load',function(){ requestAnimationFrame(function(){ autoGrow(); fit(); }); });
</script>
</body>
</html>
